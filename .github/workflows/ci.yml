name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build tests (debug)
        run: swift build --build-tests

      - name: Test (直接执行 xctest bundle，实时输出 + 看门狗)
        run: |
          set +e
          FAILED=0
          for NAME in DeskvanicCoreTests DeskvanicModuleTests; do
            BUNDLE=$(find .build -name "$NAME.xctest" -not -path "*/\.*intermediates/*" | head -1)
            if [[ -z "$BUNDLE" ]]; then
              echo "❌ 找不到 $NAME.xctest"; find .build -name "*.xctest" | head -5; FAILED=1; continue
            fi
            echo ""
            echo "════ $NAME ($BUNDLE) 开始 $(date -u +%H:%M:%S) ════"
            NSUnbufferedIO=YES xcrun xctest "$BUNDLE" 2>&1 & PID=$!
            ( sleep 1500; echo "⏰ $NAME 超时（25 分钟），强制结束"; pkill -P $PID; kill $PID ) & W=$!
            wait $PID; RC=$?
            kill $W 2>/dev/null
            echo "════ $NAME 结束 rc=$RC $(date -u +%H:%M:%S) ════"
            [ $RC -ne 0 ] && FAILED=1
          done
          exit $FAILED

      - name: Package .app
        run: scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deskvanic-app
          path: build/Deskvanic.app
