name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选用最新 Xcode（与本地开发工具链一致）
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "选择: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version 2>&1 | head -1

      - name: Test (swift test + 25 分钟看门狗)
        run: |
          swift test 2>&1 & PID=$!
          ( sleep 1500; echo "⏰ 测试超时（25 分钟），强制结束"; pkill -P $PID; kill $PID ) & W=$!
          wait $PID; RC=$?
          kill $W 2>/dev/null || true
          echo "测试退出码: $RC"
          exit $RC

      - name: Package .app
        run: scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deskvanic-app
          path: build/Deskvanic.app
