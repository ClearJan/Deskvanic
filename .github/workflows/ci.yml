name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build tests
        run: swift build --build-tests

      # 说明：GitHub 无头 runner 上 `swift test` 与 swiftpm-testing-helper 整批执行会静默挂起
      # （Xcode 26.x 已知问题，swiftlang/swift-package-manager#8394 / actions/runner-images#13096）。
      # 因此逐测试套件单独执行（helper 的 --filter 透传），配合短看门狗精确定位问题套件。
      - name: Test (逐套件 + 90s 看门狗 + 汇总守卫)
        run: |
          set +e
          TOOLCHAIN_BIN=$(dirname "$(xcrun -f swift)")
          HELPER=$(cd "$TOOLCHAIN_BIN/../libexec/swift/pm" && pwd)/swiftpm-testing-helper
          PLATFORM_DIR=$(xcrun --show-sdk-platform-path)
          export DYLD_LIBRARY_PATH="$PLATFORM_DIR/Developer/usr/lib"
          export DYLD_FRAMEWORK_PATH="$PLATFORM_DIR/Developer/Library/Frameworks"
          export NSUnbufferedIO=YES NO_COLOR=1

          BIN=$(find .build -name "*.xctest" -not -path "*intermediates*" | sort | head -1)/Contents/MacOS/$(basename "${B%.xctest}")
          BUNDLE=$(find .build -name "*.xctest" -not -path "*intermediates*" | sort | head -1)
          BIN="$BUNDLE/Contents/MacOS/$(basename "${BUNDLE%.xctest}")"
          [[ -x "$BIN" ]] || { echo "❌ 测试二进制不存在: $BIN"; exit 1; }

          SUITES=$(grep -rhoE '@Suite\("[^"]+"' Tests/ | sed 's/@Suite("//;s/"$//' | sort -u)
          TOTAL_PASS=0; TOTAL_FAIL=0; HUNG=""; FAILED_SUITES=""
          for S in $SUITES; do
            OUT=$(mktemp)
            "$HELPER" --test-bundle-path "$BIN" --filter "$S" "$BIN" --testing-library swift-testing > "$OUT" 2>&1 & PID=$!
            ( sleep 90; kill $PID 2>/dev/null ) & W=$!
            wait $PID; RC=$?
            kill $W 2>/dev/null
            P=$(grep -cE "✔ Test .* passed" "$OUT" || true)
            F=$(grep -cE "✘" "$OUT" || true)
            TOTAL_PASS=$((TOTAL_PASS+P)); TOTAL_FAIL=$((TOTAL_FAIL+F))
            if [ "$RC" -ne 0 ]; then
              if [ "$P" -eq 0 ] && [ "$F" -eq 0 ]; then
                HUNG="$HUNG'$S' "
                echo "⏰/❌ 套件 $S → rc=$RC（无输出：挂起或执行层未启动）"
              else
                FAILED_SUITES="$FAILED_SUITES'$S' "
                echo "--- 套件 $S 输出尾部 ---"
                tail -15 "$OUT"
              fi
            fi
            rm -f "$OUT"
          done

          echo ""
          echo "════════ 汇总 ════════"
          echo "通过用例: $TOTAL_PASS  失败断言: $TOTAL_FAIL"
          echo "挂起/未启动套件: ${HUNG:-无}"
          echo "有失败断言的套件: ${FAILED_SUITES:-无}"
          # 防假绿：总通过数必须 ≥ 200（本地 215），且无失败、无挂起
          if [ "$TOTAL_FAIL" -gt 0 ] || [ -n "$HUNG" ] || [ -n "$FAILED_SUITES" ] || [ "$TOTAL_PASS" -lt 200 ]; then
            echo "❌ CI 测试不达标"
            exit 1
          fi
          echo "✅ 全部套件通过"

      - name: Package .app
        run: scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deskvanic-app
          path: build/Deskvanic.app
