name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 无头 VM 的应用防火墙会静默丢弃入站 socket，导致传输类测试挂起（本地无此问题）
      - name: 关闭 runner 自带应用防火墙
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate || true

      - name: Build tests
        run: swift build --build-tests

      # 说明：GitHub 无头 runner 上 `swift test` 执行层会静默挂起（Xcode 26.x 已知问题，
      # swiftlang/swift-package-manager#8394 / actions/runner-images#13096），
      # 因此直接调用 SwiftPM 同款执行器 swiftpm-testing-helper，并逐套件（--filter 按类型名）执行。
      - name: Test (逐套件 + 看门狗 + 汇总守卫)
        run: |
          set +e
          TOOLCHAIN_BIN=$(dirname "$(xcrun -f swift)")
          HELPER=$(cd "$TOOLCHAIN_BIN/../libexec/swift/pm" && pwd)/swiftpm-testing-helper
          PLATFORM_DIR=$(xcrun --show-sdk-platform-path)
          export DYLD_LIBRARY_PATH="$PLATFORM_DIR/Developer/usr/lib"
          export DYLD_FRAMEWORK_PATH="$PLATFORM_DIR/Developer/Library/Frameworks"
          export NSUnbufferedIO=YES NO_COLOR=1

          BUNDLE=$(find .build -name "*.xctest" -not -path "*intermediates*" | sort | head -1)
          BIN="$BUNDLE/Contents/MacOS/$(basename "${BUNDLE%.xctest}")"
          [[ -x "$BIN" ]] || { echo "❌ 测试二进制不存在: $BIN"; exit 1; }

          # --filter 匹配测试标识符（类型名），而非 @Suite 中文显示名
          SUITES=$(grep -rhoE '(struct|class) [A-Za-z0-9_]+Tests' Tests/ | awk '{print $2}' | sort -u)
          TOTAL_PASS=0; TOTAL_FAIL=0; TOTAL_SKIP=0; HUNG=""; FAILED_SUITES=""
          for S in $SUITES; do
            OUT=$(mktemp)
            "$HELPER" --test-bundle-path "$BIN" --filter "$S" "$BIN" --testing-library swift-testing > "$OUT" 2>&1 & PID=$!
            ( sleep 120; kill $PID 2>/dev/null ) & W=$!
            wait $PID; RC=$?
            kill $W 2>/dev/null
            P=$(grep -cE "✔ Test .* passed" "$OUT" || true)
            # 真实失败 = recorded an issue / failed after；runner 旧版 swift-testing 用 ✘ 打印 skipped 行，须排除
            F=$(grep -cE "✘ Test .* (recorded an issue|failed after)" "$OUT" || true)
            SKIP=$(grep -c " skipped: " "$OUT" || true)
            TOTAL_SKIP=$((TOTAL_SKIP+SKIP))
            Z=$(grep -c "Test run with 0 tests" "$OUT" || true)
            TOTAL_PASS=$((TOTAL_PASS+P)); TOTAL_FAIL=$((TOTAL_FAIL+F))
            if [ "$RC" -ge 124 ]; then
              HUNG="$HUNG'$S' "
              echo "⏰ 套件 $S 被看门狗终止（尾部输出）："
              tail -5 "$OUT"
            elif [ "$F" -gt 0 ] || { [ "$RC" -ne 0 ] && [ "$Z" -eq 0 ]; }; then
              FAILED_SUITES="$FAILED_SUITES'$S' "
              echo "❌ 套件 $S → rc=$RC（尾部输出）："
              tail -8 "$OUT"
            elif [ "$Z" -gt 0 ]; then
              echo "ℹ️ 套件 $S 在此 bundle 无匹配用例，跳过"
            fi
            rm -f "$OUT"
          done

          echo ""
          echo "════════ 汇总 ════════"
          echo "通过用例: $TOTAL_PASS  失败断言: $TOTAL_FAIL  环境跳过: $TOTAL_SKIP（原因见上方 skipped 行）"
          echo "挂起套件: ${HUNG:-无}"
          echo "失败套件: ${FAILED_SUITES:-无}"
          # 防假绿：总通过数必须 ≥ 200（全量 215），且无失败、无挂起
          if [ "$TOTAL_FAIL" -gt 0 ] || [ -n "$HUNG" ] || [ -n "$FAILED_SUITES" ] || [ "$TOTAL_PASS" -lt 200 ]; then
            echo "❌ CI 测试不达标"
            exit 1
          fi
          echo "✅ 全部套件通过"

      - name: Package .app
        run: scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deskvanic-app
          path: build/Deskvanic.app
