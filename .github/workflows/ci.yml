name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build tests (debug)
        run: swift build --build-tests

      - name: Test (逐 bundle 实时输出 + 分段看门狗)
        run: |
          set +e
          FAILED=0
          for BUNDLE in DeskvanicCoreTests DeskvanicModuleTests; do
            echo ""
            echo "════ $BUNDLE 开始 $(date -u +%H:%M:%S) ════"
            xcrun xctest ".build/debug/$BUNDLE.xctest" 2>&1 & PID=$!
            LIMIT=1500
            ( sleep $LIMIT; echo "⏰ $BUNDLE 超时（25 分钟），强制结束"; pkill -P $PID; kill $PID ) & W=$!
            wait $PID; RC=$?
            kill $W 2>/dev/null
            echo "════ $BUNDLE 结束 rc=$RC $(date -u +%H:%M:%S) ════"
            [ $RC -ne 0 ] && FAILED=1
          done
          exit $FAILED

      - name: Package .app
        run: scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deskvanic-app
          path: build/Deskvanic.app
